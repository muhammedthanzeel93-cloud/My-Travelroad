          type: number
          nullable: true
          example: 140.0
        accuracyMeters:
          type: number
          nullable: true
          example: 4.5
        formattedAddress:
          type: string
        locality:
          type: string
          nullable: true
        talukOrSubdivision:
          type: string
        district:
          type: string
        stateOrProvince:
          type: string
        countryCode:
          type: string
        postalCode:
          type: string
          nullable: true
        isRestricted:
          type: boolean
        restrictionReason:
          type: string
          nullable: true
        publicCentroidCoordinates:
          type: array
          description: Approved approximate public centroid [longitude, latitude]
          items:
            type: number
          nullable: true
          minItems: 2
          maxItems: 2
          example: [76.32, 11.35]
        publicApproximateDisplayName:
          type: string
          nullable: true
        maskLocality:
          type: boolean

