# ==============================================================================
# Components
# ==============================================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived JSON Web Token (15m lifespan)
    CookieAuth:
      type: apiKey
      in: cookie
      name: refreshToken
      description: HttpOnly, Secure, SameSite=Strict cryptographic refresh token cookie (Path=/api/v1/auth). Enforces mandatory X-Requested-With header to eliminate cross-site request forgery.

  parameters:
    CSRFHeader:
      name: X-Requested-With
      in: header
      required: true
      schema:
        type: string
        enum: [XMLHttpRequest]
      description: Mandatory header to guard against cross-site request forgery on cookie-authenticated auth endpoints.
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 1
        minimum: 1
    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    SortParam:
      name: sort
      in: query
      required: false
      schema:
        type: string
        example: createdAt:desc

  responses:
    400BadRequest:
      description: Bad request syntax or malformed parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    401Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    403Forbidden:
      description: Caller lacks required permissions or fails ownership assertion
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    404NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    409Conflict:
      description: Resource uniqueness conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    422ValidationError:
      description: Request body validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    429TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    500InternalServerError:
      description: Internal server error or transactional audit failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'

  schemas:
    # --------------------------------------------------------------------------
    # Base Envelopes & Diagnostics
    # --------------------------------------------------------------------------
    StandardSuccessResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    StandardErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          $ref: '#/components/schemas/ErrorPayload'

    ErrorPayload:
      type: object
      required: [code, message, requestId, timestamp]
      properties:
        code:
          type: string
          example: VALIDATION_FAILED
        message:
          type: string
          example: The request payload failed schema validation.
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        requestId:
          type: string
          example: req_01JB89Z8H1K4V9Z0P9R8E7W6T2
        timestamp:
          type: string
          format: date-time
          example: '2026-11-15T15:00:00.000Z'

    ErrorDetail:
      type: object
      required: [field, issue]
      properties:
        field:
          type: string
          example: email
        issue:
          type: string
          example: Invalid email address format

    ResponseMeta:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
        timestamp:
          type: string
          format: date-time

    PaginationMeta:
      type: object
      required: [page, limit, totalItems, totalPages, hasNextPage, hasPrevPage]
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        totalItems:
          type: integer
          example: 48
        totalPages:
          type: integer
          example: 3
        hasNextPage:
          type: boolean
          example: true
        hasPrevPage:
          type: boolean
          example: false

    MessageResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [message]
          properties:
            message:
              type: string
              example: Operation successful.

    # --------------------------------------------------------------------------
    # Auth & Identity Schemas
    # --------------------------------------------------------------------------
    RegisterRequest:
      type: object
      required: [email, password, displayName, handle]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          example: amina.rahman@example.com
        password:
          type: string
          minLength: 8
          maxLength: 72
          example: Password123!
        displayName:
          type: string
          minLength: 2
          maxLength: 120
          example: Amina Rahman
        handle:
          type: string
          minLength: 3
          maxLength: 50
          pattern: '^[a-z0-9_]+$'
          example: amina_explorer
        preferredLanguage:
          type: string
          default: en
          example: en

    RegisterResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [account, profile]
          properties:
            account:
              $ref: '#/components/schemas/AccountSummary'
            profile:
              $ref: '#/components/schemas/TouristProfileSummary'

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: amina.rahman@example.com
        password:
          type: string
          example: Password123!

    LoginResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [accessToken, tokenType, expiresIn, account]
          properties:
            accessToken:
              type: string
              example: eyJhbGciOiJSUzI1NiIs...
            tokenType:
              type: string
              example: Bearer
            expiresIn:
              type: integer
              example: 900
            account:
              $ref: '#/components/schemas/AccountSummary'

    TokenRefreshResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [accessToken, tokenType, expiresIn]
          properties:
            accessToken:
              type: string
              example: eyJhbGciOiJSUzI1NiIs...
            tokenType:
              type: string
              example: Bearer
            expiresIn:
              type: integer
              example: 900

    CurrentUserResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [account, profile]
          properties:
            account:
              $ref: '#/components/schemas/AccountSummary'
            profile:
              $ref: '#/components/schemas/TouristProfileSummary'

    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
          example: pwr_01JB89Z8H1K4V9Z0P9R8E7W6T2
        newPassword:
          type: string
          minLength: 8
          maxLength: 72
          example: NewSecurePassword456!

    ResendVerificationRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: traveler@example.com
          description: Required if caller is unauthenticated; optional if caller presents a valid Bearer token for a pending_verification account.

    ResendVerificationResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [message, dispatched]
          properties:
            message:
              type: string
              example: If the account exists and is pending verification, a new confirmation link has been dispatched.
            dispatched:
              type: boolean
              example: true

    AccountSummary:
      type: object
      required: [id, email, role, status]
      properties:
        id:
          type: string
          format: uuid
          example: e7b0a880-922c-47b2-9a57-0b1a78e7f101
        email:
          type: string
          format: email
          example: amina.rahman@example.com
        role:
          type: string
          enum: [traveler, contributor, curator, moderator, super_admin]
          example: traveler
        status:
          type: string
          enum: [active, suspended, pending_verification, deactivated]
          example: active
        emailVerified:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time

    TouristProfileSummary:
      type: object
      required: [id, displayName, handle]
      properties:
        id:
          type: string
          format: uuid
          example: f8c1b991-033d-58c3-ab68-1c2b89f8a202
        displayName:
          type: string
          example: Amina Rahman
        handle:
          type: string
          example: amina_explorer
        avatarUrl:
          type: string
          nullable: true
          example: https://assets.mytravelroad.com/avatars/amina.jpg

    # --------------------------------------------------------------------------
    # Profile Schemas
    # --------------------------------------------------------------------------
    UpdateProfileRequest:
      type: object
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 120
        bio:
          type: string
          maxLength: 500
        homeRegion:
          type: string
          maxLength: 120
        preferredLanguage:
          type: string
          maxLength: 10
        travelPreferences:
          type: array
          items:
            type: string
            enum:
              - ecotourism_nature
              - cultural_heritage
              - waterfalls_trekking
              - coastal_estuaries
              - ayurvedic_wellness
              - culinary_food_trails
              - wildlife_birdwatching
              - photography
              - family_friendly

    TouristProfileEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [id, displayName, handle, travelPreferences, isPublic]
          properties:
            id:
              type: string
              format: uuid
            displayName:
              type: string
            handle:
              type: string
            avatarUrl:
              type: string
              nullable: true
            bio:
              type: string
              nullable: true
            homeRegion:
              type: string
              nullable: true
            preferredLanguage:
              type: string
            travelPreferences:
              type: array
              items:
                type: string
            isPublic:
              type: boolean
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    PublicTouristProfileEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [displayName, handle, travelPreferences]
          properties:
            displayName:
              type: string
            handle:
              type: string
            avatarUrl:
              type: string
              nullable: true
            bio:
              type: string
              nullable: true
            homeRegion:
              type: string
              nullable: true
            travelPreferences:
              type: array
              items:
                type: string
            createdAt:
              type: string
              format: date-time

    # --------------------------------------------------------------------------
    # Taxonomy Schemas
    # --------------------------------------------------------------------------
    CategoryResponse:
      type: object
      required: [id, slug, name, shortLabel, description, iconKey, displayOrder, status]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        shortLabel:
          type: string
        description:
          type: string
        iconKey:
          type: string
        parentId:
          type: string
          format: uuid
          nullable: true
        displayOrder:
          type: integer
        status:
          type: string
          enum: [active, inactive, archived]

    CategoryListEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/CategoryResponse'

    CategoryDetailEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          allOf:
            - $ref: '#/components/schemas/CategoryResponse'
            - type: object
              properties:
                subcategories:
                  type: array
                  items:
                    $ref: '#/components/schemas/CategoryResponse'

    CreateCategoryRequest:
      type: object
      required: [name, slug, shortLabel, description, iconKey]
      properties:
        name:
          type: string
          maxLength: 100
        slug:
          type: string
          maxLength: 100
        shortLabel:
          type: string
          maxLength: 50
        description:
          type: string
        iconKey:
          type: string
          maxLength: 50
        parentId:
          type: string
          format: uuid
          nullable: true
        displayOrder:
          type: integer
          default: 0

    UpdateCategoryRequest:
      type: object
      properties:
        name:
          type: string
        shortLabel:
          type: string
        description:
          type: string
        iconKey:
          type: string
        displayOrder:
          type: integer
        status:
          type: string
          enum: [active, inactive, archived]

    # --------------------------------------------------------------------------
    # Destination Schemas
    # --------------------------------------------------------------------------
    DestinationSummary:
      type: object
      required: [id, slug, title, shortDescription, district]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        shortDescription:
          type: string
        district:
          type: string
        talukOrSubdivision:
          type: string
        primaryCategory:
