          type: object
          required: [coordinates, formattedAddress, talukOrSubdivision, district, stateOrProvince]
          properties:
            coordinates:
              type: array
              items:
                type: number
              minItems: 2
              maxItems: 2
              example: [76.3125, 11.3412]
            altitudeMeters:
              type: number
              nullable: true
            accuracyMeters:
              type: number
              nullable: true
            isRestricted:
              type: boolean
              default: false
            restrictionReason:
              type: string
              nullable: true
